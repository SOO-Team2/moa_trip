{% extends 'base.html' %}
{% load static %}

{% block title %}로그인 / 회원가입 - 모아트립{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <section class="auth-left-panel">
      <div>
        <h2>모아트립</h2>
        
        <h1>
          로그인 /<br>회원가입
        </h1>
      </div>
    </section>

    <main class="auth-right-panel">
      <nav class="auth-tabs">
        <a href="#" class="active">로그인</a>
        <a href="#">회원가입</a>
      </nav>

      <form class="auth-form" method="post" action="#">
        {% csrf_token %}
        <div class="auth-field-group">
          <label>아이디</label>
          <input type="text" placeholder="myun9ju" required>
        </div>

        <div class="auth-field-group">
          <label>비밀번호</label>
          <input type="password" placeholder="비밀번호를 입력하세요" required>
        </div>

        <button type="submit" class="auth-submit-btn">로그인</button>
      </form>
    </main>
  </div>
</div>
{% endblock %}
